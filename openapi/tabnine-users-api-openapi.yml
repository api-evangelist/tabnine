components:
  schemas:
    GetUsersIdResponse:
      type: object
      properties:
        '200':
          type: string
          description: OK.
        '401':
          type: string
          description: Missing/invalid bearer token, org mismatch, IDP sync disabled for the org, key ID mismatch, or key expired (verifyIdpKeyMiddleware in auth-service).
        '404':
          type: string
          description: Not Found.
    GetUsersResponse:
      type: object
      properties:
        '200':
          type: string
          description: 'OK. Deviation - no real pagination handling (`AuthClient.getUsers` has `// TODO: handle pagination`); totalResults may not reflect true dataset size across pages.'
        '400':
          type: string
          description: Bad Request.
        '401':
          type: string
          description: Missing/invalid bearer token, org mismatch, IDP sync disabled for the org, key ID mismatch, or key expired (verifyIdpKeyMiddleware in auth-service).
    PostUsersResponse:
      type: object
      properties:
        '201':
          type: string
          description: Created.
        '400':
          type: string
          description: Missing `userName` or `externalId`. (These are the only two fields validated at runtime, despite `meta.resourceType` being typed as required — it is not enforced.)
        '401':
          type: string
          description: Missing/invalid bearer token, org mismatch, IDP sync disabled for the org, key ID mismatch, or key expired (verifyIdpKeyMiddleware in auth-service).
        '409':
          type: string
          description: Deviation from RFC (no standard SCIM 409 body defined) - a user with this `userName` already has an `externalId` set.
    PostUsersRequest:
      type: object
      properties:
        CreateScimUser:
          type: string
          description: Schema for creating a user
      required:
      - CreateScimUser
