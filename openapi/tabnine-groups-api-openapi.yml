components:
  schemas:
    GetGroupsResponse:
      type: object
      properties:
        '200':
          type: string
          description: Deviation - if the organization's IDP sync mode is not `UsersAndTeams` (i.e. group provisioning isn't enabled for that org/token), this returns 200 with an empty list rather than an error, masking the feature-flag state.
        '401':
          type: string
          description: Missing/invalid bearer token, org mismatch, IDP sync disabled for the org, key ID mismatch, or key expired (verifyIdpKeyMiddleware in auth-service).
    PutGroupsIdResponse:
      type: object
      properties:
        '200':
          type: string
          description: Deviation - if sync mode is not `UsersAndTeams`, fabricates a 200 echo of the input without persisting anything (same no-op pattern as POST /Groups).
        '404':
          type: string
          description: Not Found.
    PostGroupsRequest:
      type: object
      properties:
        CreateScimGroup:
          type: string
          description: Schema for creating a group
      required:
      - CreateScimGroup
    PostGroupsResponse:
      type: object
      properties:
        '201':
          type: string
          description: Deviation (significant) - if the org's sync mode is not `UsersAndTeams`, this endpoint does NOT call auth-service at all. It fabricates a 201 response with a random UUID and echoes the input back. The caller is told the group was created; nothing was persisted.
        '400':
          type: string
          description: Missing `externalId`.
    GetGroupsIdResponse:
      type: object
      properties:
        '200':
          type: string
          description: OK.
        '404':
          type: string
          description: Not found, OR sync mode is not `UsersAndTeams` (both cases return 404 here - inconsistent with GET /Groups, which returns an empty 200 list for the same disabled-sync-mode condition instead of an error).
    PutGroupsIdRequest:
      type: object
      properties:
        UpdateScimGroup:
          type: string
          description: Schema for updating a group
      required:
      - UpdateScimGroup
  securitySchemes:
    Personal_Access_Token:
      type: http
      scheme: bearer
      x-source: https://docs.tabnine.com/main/getting-started/install/client-setup-private-installation/sign-in-using-authentication-token.md
